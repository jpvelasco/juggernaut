version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: juggernaut
    main: .
    binary: juggernaut
    ldflags:
      - -s -w -X github.com/jpvelasco/juggernaut/v5/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: juggernaut
    name_template: "juggernaut_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    files:
      - src: LICENSE*
      - src: README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: jpvelasco
    name: juggernaut
  name_template: "v{{.Version}}"
  # Publish the GitHub release immediately on tag push. With draft: true,
  # GoReleaser uploads assets but leaves the release unpublished, and nothing
  # in release.yml un-drafts it — so every release since #212 required a manual
  # `gh release edit --draft=false`. The npm publish steps run regardless, which
  # masked the broken GitHub-release half. Keep this false so a tag push fully
  # publishes with no manual step.
  draft: false
