version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: juggernaut
    main: .
    binary: juggernaut
    ldflags:
      - -s -w -X github.com/jpvelasco/juggernaut/v4/cmd.Version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: juggernaut
    name_template: "juggernaut_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jpvelasco
    name: juggernaut
  name_template: "v{{.Version}}"
