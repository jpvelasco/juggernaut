name: Codacy Local Analysis

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  codacy-local:
    name: Codacy Local Analysis
    runs-on: ubuntu-latest

    env:
      CODACY_CLI_V2_VERSION: 1.0.0-main.380.sha.27e119a

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y curl tar

      - name: Install optional standalone linters
        run: sudo apt-get install -y shellcheck

      - name: Install Codacy tools
        shell: bash
        run: bash <(curl -Ls https://raw.githubusercontent.com/codacy/codacy-cli-v2/main/codacy-cli.sh) install

      - name: Run Codacy full analysis
        shell: bash
        run: |
          chmod +x scripts/codacy-full.sh
          ./scripts/codacy-full.sh
