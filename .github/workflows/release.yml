name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6
        with:
          go-version: "stable"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89  # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy platform binaries into npm sub-packages
        run: bash scripts/copy-npm-binaries.sh

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform sub-packages to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED=$(jq -r '.version' ../bedrock-config.json)
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "ERROR: tag $VERSION does not match bedrock-config.json $EXPECTED"
            exit 1
          fi

          for PKG in \
            packages/juggernaut-bedrock-linux-x64 \
            packages/juggernaut-bedrock-linux-arm64 \
            packages/juggernaut-bedrock-darwin-x64 \
            packages/juggernaut-bedrock-darwin-arm64 \
            packages/juggernaut-bedrock-win32-x64; do
            echo "Publishing $PKG..."
            (cd "$PKG" && npm version "$VERSION" --no-git-tag-version && npm publish --access public)
          done

      - name: Publish main package to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.argv[1];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          npm publish --access public
