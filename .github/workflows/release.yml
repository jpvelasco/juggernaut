name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify GitHub release is published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft)
          if [ "$DRAFT" != "false" ]; then
            echo "ERROR: release $TAG is still a draft — aborting before npm publish"
            exit 1
          fi
          ASSETS=$(gh release view "$TAG" --json assets -q '.assets | length')
          if [ "$ASSETS" -lt 6 ]; then
            echo "ERROR: release $TAG has $ASSETS assets, expected at least 6 (5 archives + checksums.txt)"
            exit 1
          fi
          echo "GitHub release $TAG is published with $ASSETS assets"

      - name: Copy platform binaries into npm sub-packages
        run: bash scripts/copy-npm-binaries.sh

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform sub-packages to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED=$(jq -r '.version' ../bedrock-config.json)
          if [ "$VERSION" != "$EXPECTED" ]; then
            echo "ERROR: tag $VERSION does not match bedrock-config.json $EXPECTED"
            exit 1
          fi

          for PKG in \
            packages/juggernaut-bedrock-linux-x64 \
            packages/juggernaut-bedrock-linux-arm64 \
            packages/juggernaut-bedrock-darwin-x64 \
            packages/juggernaut-bedrock-darwin-arm64 \
            packages/juggernaut-bedrock-win32-x64; do
            echo "Publishing $PKG..."
            (cd "$PKG" && npm version "$VERSION" --no-git-tag-version && npm publish --access public)
          done

      - name: Publish main package to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            for (const dep of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[dep] = process.argv[1];
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$VERSION"
          npm publish --access public
