name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Verify version sync
        run: |
          FILE_VERSION=$(cat VERSION)
          JSON_VERSION=$(jq -r '.version' bedrock-config.json)
          GO_VERSION=$(grep 'var Version' cmd/root.go | grep -oP '"[^"]+"' | tr -d '"')
          if [ "$FILE_VERSION" != "$JSON_VERSION" ] || [ "$FILE_VERSION" != "$GO_VERSION" ]; then
            echo "Version mismatch: VERSION=$FILE_VERSION bedrock-config.json=$JSON_VERSION cmd/root.go=$GO_VERSION"
            exit 1
          fi
          echo "Version sync OK: $FILE_VERSION"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      - name: Run tests
        run: go test ./... -v
