name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Verify version sync
        run: |
          FILE_VERSION=$(cat VERSION)
          JSON_VERSION=$(jq -r '.version' bedrock-config.json)
          GO_VERSION=$(grep 'var Version' cmd/root.go | grep -oP '"[^"]+"' | tr -d '"')
          if [ "$FILE_VERSION" != "$JSON_VERSION" ] || [ "$FILE_VERSION" != "$GO_VERSION" ]; then
            echo "Version mismatch: VERSION=$FILE_VERSION bedrock-config.json=$JSON_VERSION cmd/root.go=$GO_VERSION"
            exit 1
          fi
          echo "Version sync OK: $FILE_VERSION"
      - name: Verify GoReleaser auto-publishes releases
        run: |
          if grep -qE '^\s*draft:\s*true' .goreleaser.yml; then
            echo "ERROR: .goreleaser.yml has draft: true; .github/workflows/release.yml does not un-draft releases"
            exit 1
          fi
          echo "GoReleaser draft check OK"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  lint-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9
        with:
          version: v2.12.2
          args: --timeout=5m

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    strategy:
      fail-fast: false  # one leg failing must not cancel the others' coverage uploads
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # OIDC; lets each leg mint the Codecov upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Run in bash on every OS so the working directory and tooling are
      # consistent. Go on the Windows runner writes coverage.out with CRLF line
      # endings, which Codecov's parser rejects (the upload lands in an ERROR
      # state and never merges), so strip CR in the same step. tr is identical
      # on GNU/BSD/Git-bash; the strip is a no-op on Linux/macOS.
      - name: Run tests with coverage
        shell: bash
        run: |
          go test ./... -v -coverprofile=coverage.out -covermode=atomic
          tr -d '\r' < coverage.out > coverage.tmp && mv coverage.tmp coverage.out
      # Upload per-OS coverage so Codecov merges all three legs. Much of the
      # PowerShell/launcher/keychain code is Windows-only, so a Linux-only
      # report understates true coverage; merging the OS matrix reflects it.
      # use_pypi: true — install CLI from PyPI instead of cli.codecov.io so we
      # skip native-binary GPG verification (fails with "Could not verify
      # signature" when key import is empty; codecov/codecov-action#1876).
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          files: ./coverage.out
          fail_ci_if_error: ${{ matrix.os != 'windows-latest' }}
      # Codacy coverage is uploaded by the trusted workflow_run workflow.
      # Keeping the report in an artifact lets Dependabot PRs provide coverage
      # without making the repository API token available to PR code.
      - name: Save coverage for Codacy
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: codacy-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.out
          if-no-files-found: error

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests with race detector
        run: go test -race ./... -v

  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC; lets the job mint the Codecov upload token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Run tests with coverage
        run: |
          gotestsum --junitfile junit.xml --format pkgname -- \
            -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%' | cut -d. -f1)
          echo "Coverage: ${TOTAL}%"
          # Linux-only floor — Windows-only code is not exercised here, so
          # this sits below the merged Codecov total. The Codecov project gate
          # (codecov.yml) is the authoritative 80% gate that blocks merges.
          # This CI gate catches gross regressions before the upload completes.
          if [ "${TOTAL}" -lt 65 ]; then
            echo "Coverage below 65% threshold"
            exit 1
          fi
      # Coverage uploads come from the OS matrix (test job); this job only
      # enforces the local Linux floor and uploads JUnit for Test Analytics.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          use_pypi: true
          report_type: test_results
          files: ./junit.xml

  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('npm/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Run npm tests
        working-directory: npm
        run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Shellcheck install scripts
        run: |
          shellcheck scripts/install.sh scripts/copy-npm-binaries.sh

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -exclude=G204,G304,G702,G703 ./...

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      # Build-only: verifies .goreleaser.yml compiles all platforms. NEVER
      # publishes (no `release`, no tag). Catches config breakage on PRs.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7
        with:
          args: build --snapshot --clean
      - name: Smoke-test the built linux binary
        run: |
          BIN=$(find dist -type f -name juggernaut -path '*linux_amd64*' | head -1)
          test -n "$BIN" || { echo "no linux/amd64 juggernaut binary in dist/"; exit 1; }
          chmod +x "$BIN"
          OUT=$("$BIN" version)
          echo "$OUT"

  # Codacy Static Analysis — runs on push to main to keep the dashboard in sync.
  # PR-level checks come from the GitHub integration webhook; main-level
  # analysis does not fire automatically after squash-merge, so we run the
  # Codacy Analysis CLI here and upload results. Uses the existing project
  # token (CODACY_REPOSITORY_API_TOKEN) — no new secrets needed.
  codacy-analysis:
    name: Codacy Analysis
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08  # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_REPOSITORY_API_TOKEN }}
          upload: true
          max-allowed-issues: 2147483647
