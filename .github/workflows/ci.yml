name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26"
      - name: Verify version sync
        run: |
          FILE_VERSION=$(cat VERSION)
          JSON_VERSION=$(jq -r '.version' bedrock-config.json)
          GO_VERSION=$(grep 'var Version' cmd/root.go | grep -oP '"[^"]+"' | tr -d '"')
          if [ "$FILE_VERSION" != "$JSON_VERSION" ] || [ "$FILE_VERSION" != "$GO_VERSION" ]; then
            echo "Version mismatch: VERSION=$FILE_VERSION bedrock-config.json=$JSON_VERSION cmd/root.go=$GO_VERSION"
            exit 1
          fi
          echo "Version sync OK: $FILE_VERSION"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee  # v9
        with:
          version: v2.9
          args: --timeout=5m

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write  # OIDC; lets each leg mint the Codecov upload token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26"
      - name: Run tests with coverage
        run: go test ./... -v -coverprofile=coverage.out -covermode=atomic
      # Upload per-OS coverage so Codecov merges all three legs. Much of the
      # PowerShell/launcher/keychain code is Windows-only, so a Linux-only
      # report understates true coverage; merging the OS matrix reflects it.
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          use_oidc: true
          files: ./coverage.out
          fail_ci_if_error: true

  test-race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26"
      - name: Run tests with race detector
        run: go test -race ./... -v

  test-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # OIDC; lets the job mint the Codecov upload token
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26"
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0
      - name: Run tests with coverage
        run: |
          gotestsum --junitfile junit.xml --format pkgname -- \
            -coverprofile=coverage.out -covermode=atomic ./...
      - name: Check coverage threshold
        run: |
          TOTAL=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%' | cut -d. -f1)
          echo "Coverage: ${TOTAL}%"
          # Compare as integers — Linux-only floor (Windows-only code is not
          # exercised here; the merged Codecov gate is the real coverage check).
          if [ "${TOTAL}" -lt 52 ]; then
            echo "Coverage below 52% threshold"
            exit 1
          fi
      # Coverage uploads come from the OS matrix (test job); this job only
      # enforces the local Linux floor and uploads JUnit for Test Analytics.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3  # v1.2.1
        with:
          use_oidc: true
          files: ./junit.xml

  npm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "24"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('npm/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Run npm tests
        working-directory: npm
        run: npm test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Shellcheck install scripts
        run: |
          shellcheck scripts/install.sh scripts/copy-npm-binaries.sh

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version: "1.26"
      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.27.1 -exclude=G204,G304,G702,G703 ./...
