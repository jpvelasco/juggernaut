name: Test
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install lint dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq

      - name: Run shellcheck
        run: |
          shellcheck juggernaut install.sh commands/*.sh \
            lib/keychain.sh lib/schema.sh lib/config_manager.sh \
            lib/profile_paths.sh lib/doctor.sh \
            tests/v2/test_*.sh

      - name: Verify version sync
        run: |
          FILE_VERSION=$(tr -d '[:space:]' < VERSION)
          if command -v jq &>/dev/null; then
            JSON_VERSION=$(jq -r '.version' bedrock-config.json | tr -d '[:space:]')
          else
            JSON_VERSION=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" bedrock-config.json | tr -d '[:space:]')
          fi
          if [[ "$FILE_VERSION" != "$JSON_VERSION" ]]; then
            echo "ERROR: VERSION ($FILE_VERSION) != bedrock-config.json ($JSON_VERSION)"
            exit 1
          fi
          echo "Version sync OK: $FILE_VERSION"

          # Verify schema.sh fallback version matches VERSION.
          SCHEMA_SH_VERSION=$(grep -oE 'J_VERSION:-[0-9]+\.[0-9]+\.[0-9]+' lib/schema.sh | head -1 | cut -d- -f2)
          if [[ "$FILE_VERSION" != "$SCHEMA_SH_VERSION" ]]; then
            echo "ERROR: VERSION ($FILE_VERSION) != lib/schema.sh fallback ($SCHEMA_SH_VERSION)"
            echo "  Update the '\${J_VERSION:-X.Y.Z}' default in lib/schema.sh to match VERSION."
            exit 1
          fi
          echo "schema.sh fallback OK: $SCHEMA_SH_VERSION"

          # Verify schema.ps1 fallback version matches VERSION.
          SCHEMA_PS1_VERSION=$(grep -oE "\\\$Version = '[0-9]+\.[0-9]+\.[0-9]+'" lib/schema.ps1 | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [[ "$FILE_VERSION" != "$SCHEMA_PS1_VERSION" ]]; then
            echo "ERROR: VERSION ($FILE_VERSION) != lib/schema.ps1 fallback ($SCHEMA_PS1_VERSION)"
            echo "  Update the [string]\$Version = 'X.Y.Z' default in lib/schema.ps1 to match VERSION."
            exit 1
          fi
          echo "schema.ps1 fallback OK: $SCHEMA_PS1_VERSION"

  test-unix:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Bash 4+ (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "/opt/homebrew/bin" >> $GITHUB_PATH
          echo "/usr/local/bin" >> $GITHUB_PATH

      - name: Install Fish shell and libsecret (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fish libsecret-tools

      - name: Show environment
        run: |
          echo "OS: $OSTYPE"
          echo "Shell: $SHELL"
          echo "Bash: $(which bash)"
          bash --version | head -1

      - name: Create test-results directory
        run: mkdir -p test-results

      - name: Run bash tests
        run: |
          bash ./tests/v2/test_schema.sh        2>&1 | tee test-results/test_schema.txt
          bash ./tests/v2/test_config_manager.sh 2>&1 | tee test-results/test_config_manager.txt
          bash ./tests/v2/test_keychain.sh       2>&1 | tee test-results/test_keychain.txt
          bash ./tests/v2/test_apply.sh          2>&1 | tee test-results/test_apply.txt
          bash ./tests/v2/test_show.sh           2>&1 | tee test-results/test_show.txt
          bash ./tests/v2/test_doctor.sh         2>&1 | tee test-results/test_doctor.txt
          bash ./tests/v2/test_uninstall.sh      2>&1 | tee test-results/test_uninstall.txt
          bash ./tests/v2/test_install.sh        2>&1 | tee test-results/test_install.txt
          bash ./tests/v2/test_launcher.sh       2>&1 | tee test-results/test_launcher.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6f75727b4e67b40e017e7b96de37 # v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          retention-days: 14

      - name: Test actual keychain store/retrieve (macOS)
        if: runner.os == 'macOS'
        run: |
          TEST_KEY="br-citest-$(date +%s)"
          SERVICE="juggernaut-bedrock-test"
          ACCOUNT="test-key"

          security add-generic-password -s "$SERVICE" -a "$ACCOUNT" -w "$TEST_KEY" 2>/dev/null || true

          RETRIEVED=$(security find-generic-password -s "$SERVICE" -a "$ACCOUNT" -w 2>/dev/null)
          if [[ "$RETRIEVED" == "$TEST_KEY" ]]; then
            echo "Keychain store/retrieve works correctly"
          else
            echo "Keychain mismatch: expected '$TEST_KEY', got '$RETRIEVED'"
            exit 1
          fi

          security delete-generic-password -s "$SERVICE" -a "$ACCOUNT" 2>/dev/null || true

      - name: Run piped installer scenario (--dry-run)
        run: |
          tmp_remote="$(mktemp -d)"
          tmp_src="$(mktemp -d)"
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_remote" "$tmp_src" "$tmp_home"' EXIT
          git clone -q "$GITHUB_WORKSPACE" "$tmp_src"
          git -C "$tmp_src" checkout -q -b ci-installer-ref
          git -C "$tmp_src" config user.email test@example.invalid
          git -C "$tmp_src" config user.name "Juggernaut CI"
          printf 'ci-installer-ref\n' > "$tmp_src/VERSION"
          git -C "$tmp_src" add VERSION
          git -C "$tmp_src" commit -q -m "ci installer ref"
          git clone --bare -q "$tmp_src" "$tmp_remote/repo.git"
          HOME="$tmp_home" JUGGERNAUT_REPO_URL="$tmp_remote/repo.git" \
            bash ./install.sh --ref ci-installer-ref --dry-run
          test ! -d "$tmp_home/.juggernaut"

      - name: Run piped installer scenario (install)
        run: |
          tmp_remote="$(mktemp -d)"
          tmp_src="$(mktemp -d)"
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_remote" "$tmp_src" "$tmp_home"' EXIT
          git clone -q "$GITHUB_WORKSPACE" "$tmp_src"
          git -C "$tmp_src" checkout -q -b ci-installer-ref
          git -C "$tmp_src" config user.email test@example.invalid
          git -C "$tmp_src" config user.name "Juggernaut CI"
          printf 'ci-installer-ref\n' > "$tmp_src/VERSION"
          git -C "$tmp_src" add VERSION
          git -C "$tmp_src" commit -q -m "ci installer ref"
          git clone --bare -q "$tmp_src" "$tmp_remote/repo.git"
          HOME="$tmp_home" JUGGERNAUT_REPO_URL="$tmp_remote/repo.git" \
            bash ./install.sh --ref ci-installer-ref
          test "$(tr -d '\r\n ' < "$tmp_home/.juggernaut/VERSION")" = "ci-installer-ref"
          # v3 installer no longer auto-applies — settings.json must NOT contain a juggernaut block
          if [[ -f "$tmp_home/.claude/settings.json" ]]; then
            jq -e '.juggernaut // empty' "$tmp_home/.claude/settings.json" >/dev/null && \
              { echo "FAIL: installer auto-applied juggernaut block"; exit 1; } || true
          fi

  test-windows-powershell:
    name: Test on Windows (PowerShell)
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Show environment
        shell: pwsh
        run: |
          Write-Host "PowerShell version: $($PSVersionTable.PSVersion)"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"

      - name: Test installer dry-run
        shell: pwsh
        run: .\install.ps1 -DryRun

      - name: Test installer help
        shell: pwsh
        run: .\install.ps1 -Help

      - name: Test actual Credential Manager store/retrieve
        shell: pwsh
        run: |
          $testKey = "br-citest-$(Get-Date -Format 'yyyyMMddHHmmss')"
          $target = "juggernaut-bedrock-test"

          $null = cmdkey /delete:$target 2>$null
          cmdkey /generic:$target /user:api-key /pass:$testKey

          $stored = cmdkey /list:$target 2>&1
          if ($stored -match $target) {
            Write-Host "Credential Manager store works"
          } else {
            Write-Host "Credential not found"
            exit 1
          }

          cmdkey /delete:$target

      - name: Validate JSON
        shell: pwsh
        run: Get-Content .\iam-policy.json | ConvertFrom-Json

      - name: Install Pester 5
        shell: pwsh
        run: |
          Install-Module -Name Pester -Scope CurrentUser -Force -SkipPublisherCheck -MinimumVersion 5.0.0
          Import-Module Pester -MinimumVersion 5.0.0
          Write-Host "Pester version: $((Get-Module Pester).Version)"

      - name: Run Pester tests
        timeout-minutes: 5
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $config = [PesterConfiguration]::Default
          $config.Run.Path = './tests/v2'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'JUnitXml'
          $config.TestResult.OutputPath = './pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6f75727b4e67b40e017e7b96de37 # v4
        with:
          name: pester-results
          path: pester-results.xml
          retention-days: 14

  test-windows-gitbash:
    name: Test on Windows (Git Bash)
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Show environment
        shell: bash
        run: |
          echo "OS: $OSTYPE"
          echo "Shell: $SHELL"
          echo "Bash version: $BASH_VERSION"

      - name: Create test-results directory
        shell: bash
        run: mkdir -p test-results

      - name: Run bash tests
        shell: bash
        run: |
          bash ./tests/v2/test_schema.sh        2>&1 | tee test-results/test_schema.txt
          bash ./tests/v2/test_config_manager.sh 2>&1 | tee test-results/test_config_manager.txt
          bash ./tests/v2/test_keychain.sh       2>&1 | tee test-results/test_keychain.txt
          bash ./tests/v2/test_apply.sh          2>&1 | tee test-results/test_apply.txt
          bash ./tests/v2/test_show.sh           2>&1 | tee test-results/test_show.txt
          bash ./tests/v2/test_doctor.sh         2>&1 | tee test-results/test_doctor.txt
          bash ./tests/v2/test_uninstall.sh      2>&1 | tee test-results/test_uninstall.txt
          bash ./tests/v2/test_install.sh        2>&1 | tee test-results/test_install.txt
          bash ./tests/v2/test_launcher.sh       2>&1 | tee test-results/test_launcher.txt

      - name: Test actual Credential Manager (Git Bash)
        shell: bash
        run: |
          TEST_KEY="br-citest-$(date +%s)"
          TARGET="juggernaut-bedrock-test"

          cmdkey.exe /delete:"$TARGET" >/dev/null 2>&1 || true
          cmdkey.exe /generic:"$TARGET" /user:api-key /pass:"$TEST_KEY"

          if cmdkey.exe /list:"$TARGET" 2>&1 | grep -q "$TARGET"; then
            echo "Credential Manager store works from Git Bash"
          else
            echo "Credential not found"
            exit 1
          fi

          cmdkey.exe /delete:"$TARGET" >/dev/null 2>&1 || true

      - name: Test installer dry-run
        shell: bash
        run: bash ./install.sh --dry-run

      - name: Test installer full install (Git Bash)
        shell: bash
        run: |
          tmp_remote="$(mktemp -d)"
          tmp_src="$(mktemp -d)"
          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_remote" "$tmp_src" "$tmp_home"' EXIT
          git clone -q "$GITHUB_WORKSPACE" "$tmp_src"
          git -C "$tmp_src" checkout -q -b ci-gitbash-installer
          git -C "$tmp_src" config user.email test@example.invalid
          git -C "$tmp_src" config user.name "Juggernaut CI"
          printf 'ci-gitbash-installer\n' > "$tmp_src/VERSION"
          git -C "$tmp_src" add VERSION
          git -C "$tmp_src" commit -q -m "ci gitbash installer ref"
          git clone --bare -q "$tmp_src" "$tmp_remote/repo.git"
          HOME="$tmp_home" JUGGERNAUT_REPO_URL="$tmp_remote/repo.git" \
            bash ./install.sh --ref ci-gitbash-installer
          test "$(tr -d '\r\n ' < "$tmp_home/.juggernaut/VERSION")" = "ci-gitbash-installer"
          # v3: no auto-apply
          if [[ -f "$tmp_home/.claude/settings.json" ]]; then
            jq -e '.juggernaut // empty' "$tmp_home/.claude/settings.json" >/dev/null && \
              { echo "FAIL: installer auto-applied juggernaut block"; exit 1; } || true
          fi

      - name: Upload test results (Git Bash)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6f75727b4e67b40e017e7b96de37 # v4
        with:
          name: test-results-windows-gitbash
          path: test-results/
          retention-days: 14
