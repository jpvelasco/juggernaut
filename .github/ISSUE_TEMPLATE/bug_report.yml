name: Bug Report
description: Report something that isn't working
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows
        - WSL
    validations:
      required: true
  - type: input
    id: os_version
    attributes:
      label: OS Version
      placeholder: e.g. macOS 14, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options:
        - bash
        - zsh
        - fish
        - PowerShell
        - Git Bash
        - Other
    validations:
      required: true
  - type: input
    id: shell_version
    attributes:
      label: Shell Version
      placeholder: e.g. zsh 5.9, bash 5.2, PowerShell 7.4
  - type: dropdown
    id: auth_mode
    attributes:
      label: Auth Mode
      options:
        - IAM/SSO
        - API key
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `./setup ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant Output
      description: Paste any error messages or terminal output.
      render: shell
  - type: textarea
    id: validate_output
    attributes:
      label: Validation Output
      description: Run `./validate-setup.sh` and paste the output here if applicable.
      render: shell
